version: 4

agent:
  command:
    kind: exec
    file: node
    args: [agent.mjs]
  timeout_ms: 600000

tasks:
  directory: "tasks"

verification:
  commands:
    - kind: exec
      file: node
      args: [verify.mjs]
  timeout_ms: 300000

execution:
  termination_grace_ms: 2000
  concurrency: 1
  failure_mode: continue
  isolation: shared
  worktree:
    retention: on-failure
    preparation:
      commands: []
      timeout_ms: 600000

checks:
  forbidden_files:
    - ".env"
  max_changed_files: 20
  max_diff_lines: 200
  forbidden_commands:
    - "rm -rf"
