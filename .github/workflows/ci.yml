name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: corepack prepare pnpm@10.34.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack diagnostic artifact after failure
        if: failure()
        run: node -e "require('fs').mkdirSync('diagnostics',{recursive:true})" && npm pack --pack-destination diagnostics
      - name: Upload package diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-node-${{ matrix.node }}
          path: diagnostics/*.tgz
          if-no-files-found: ignore
          retention-days: 5

  release-gate:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.34.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
